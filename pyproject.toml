[project]
name = "mewlytics"
version = "0.1.0"
description = "Pokémon VGC tournament results, teams and stats"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*", "libs/*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
# Services have test files with the same names
addopts = ["--import-mode=importlib"]

[tool.ruff]
# First-party packages for import sorting
src = ["services/*/src", "libs/*/src"]
