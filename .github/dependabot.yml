# PRs go to dev, the integration branch. Security updates still target main.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directories: ["/services/*"]
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Python stays on the version pinned in .python-version and tested in CI
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
