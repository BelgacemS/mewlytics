[project]
name = "auth"
version = "0.1.0"
description = "User accounts and RS256 access tokens, served over REST"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.143.2",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
