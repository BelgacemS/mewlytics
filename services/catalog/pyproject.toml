[project]
name = "catalog"
version = "0.1.0"
description = "Tournaments, teams and matches, served over REST"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.2",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
